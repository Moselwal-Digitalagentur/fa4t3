<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{events}">
    <div class="card mb-4">
        <div class="card-header">Events / Goals</div>
        <div class="table-fit">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th><f:translate key="LLL:EXT:fathom_analytics/Resources/Private/Language/locallang.xlf:table.eventName" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:fathom_analytics/Resources/Private/Language/locallang.xlf:table.conversions" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:fathom_analytics/Resources/Private/Language/locallang.xlf:table.uniqueConversions" /></th>
                        <th class="text-end"><f:translate key="LLL:EXT:fathom_analytics/Resources/Private/Language/locallang.xlf:table.value" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{events}" as="event">
                        <tr>
                            <td>{event.eventName}</td>
                            <td class="text-end">{event.conversions}</td>
                            <td class="text-end">{event.uniqueConversions}</td>
                            <td class="text-end">{event.formattedValue}</td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </div>
</f:if>

</html>
